name: Propor atualizacoes do Saboriza original

on:
  schedule:
    # Horario UTC; GitHub pode atrasar execucoes agendadas.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-saboriza-upstream.yml"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: sincronizar-saboriza-original
  cancel-in-progress: false

jobs:
  propose-upstream-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout do nosso Saboriza
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Consultar versao atual do repositorio original
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main \
            https://github.com/Ruanzinn01/Saboriza-Catalogo.git \
            "$RUNNER_TEMP/saboriza-original"
          echo "sha=$(git -C "$RUNNER_TEMP/saboriza-original" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Copiar codigo original preservando particularidades do nosso projeto
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/saboriza-original"
          # Essas duas versoes locais possuem ajustes proprios de configuracao
          # e autorizacao. Nunca substitui-las automaticamente.
          rsync -a --delete \
            --exclude='/main.tsx' \
            --exclude='/store/admin-auth-store.ts' \
            "$SOURCE/src/" ./src/
          rsync -a --delete "$SOURCE/public/" ./public/
          rsync -a --delete \
            --exclude="/check-schema-contract.mjs" \
            --exclude="/classify-upstream-changes.mjs" \
            --exclude="/classify-upstream-changes.test.mjs" \
            "$SOURCE/scripts/" ./scripts/
          for file in \
            index.html package.json package-lock.json \
            tsconfig.json vite.config.ts \
            .env.example .gitignore \
            "SABORIZA_MODULOS (guia de fases).md"; do
            if test -f "$SOURCE/$file"; then
              cp "$SOURCE/$file" "$file"
            fi
          done
          # O catalogo copiado deve anunciar NOSSO dominio, nao o de origem.
          if test -f ./index.html; then
            sed -i "s#https://saboriza-catalogo.vercel.app/#https://saboriza-pied.vercel.app/#g" ./index.html
          fi
          # Sem tocar .github, supabase, vercel.json, README, ZIP,
          # ajustes da hospedagem ou variaveis privadas.
          git status --short

      - name: Classificar alteracoes compativeis com nosso Supabase
        id: risk
        shell: bash
        run: node scripts/classify-upstream-changes.mjs "$RUNNER_TEMP/saboriza-original"

      - name: Verificar se a versao proposta compila
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --test scripts/classify-upstream-changes.test.mjs
          npm run build

      - name: Auditar compatibilidade do SQL versionado
        id: schema
        continue-on-error: true
        run: node scripts/check-schema-contract.mjs

      - name: Preparar PR da atualizacao no GitHub
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/saboriza-original
          delete-branch: true
          commit-message: "chore: preparar atualizacao do Saboriza original"
          title: "Atualizar codigo do Saboriza original"
          body: |
            Atualizacao detectada de [Ruanzinn01/Saboriza-Catalogo](https://github.com/Ruanzinn01/Saboriza-Catalogo).

            Commit de origem: ${{ steps.upstream.outputs.sha }}
            Build local desta proposta: ${{ steps.build.outcome }}
            Compatibilidade das migrations versionadas: ${{ steps.schema.outcome }}
            Atualizacao sem alteracao de contrato SQL e arquivos protegidos: ${{ steps.risk.outputs.auto }}

            **Merge automatico de codigo e dependencias quando contrato Supabase, migrations e configuracoes proprias permanecem inalterados, e build/testes passam.**
            Quando essa condicao nao for atendida, a atualizacao fica em PR ate existir migration correta ou revisao:
            - As migracoes originais em `scripts/*.sql` NAO sao executadas diretamente no banco.
            - Toda nova tabela e RPC deve ter SQL adaptado, revisado e versionado em `supabase/migrations/`.
            - Enquanto a checagem do contrato falhar, esta PR NAO pode ser publicada.
            - A base real (produtos, fotos, usuarios e pedidos) NAO e copiada pelo GitHub.
            - As versoes locais de `src/main.tsx` e `src/store/admin-auth-store.ts` foram mantidas.
            - Comparar o novo frontend com o banco e as permissoes da instalacao propria;
              aplicar migracoes necessarias de forma aditiva e verificar os fluxos.
            - Conferir eventuais arquivos excluidos no diff antes de aprovar.
          add-paths: |
            src
            public
            scripts
            index.html
            package.json
            package-lock.json
            tsconfig.json
            vite.config.ts
            .env.example
            .gitignore
            SABORIZA_MODULOS (guia de fases).md

      - name: Bloquear proposta sem SQL compativel
        if: steps.schema.outcome == 'failure'
        run: |
          echo "::error::O projeto original necessita de novas migrations no nosso Supabase. Nao efetuar merge/deploy."
          exit 1

      - name: Sinalizar proposta com build falhando
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::O codigo novo nao passou no build. Nao aprove a proposta antes de corrigir."
          exit 1

      - name: Incorporar atualizacao compativel e iniciar release banco primeiro
        if: ${{ steps.build.outcome == 'success' && steps.schema.outcome == 'success' && steps.risk.outputs.auto == 'true' && steps.pr.outputs.pull-request-number != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          EXPECTED_HEAD: ${{ steps.pr.outputs.pull-request-head-sha }}
        run: |
          set -euo pipefail
          actual="$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)"
          if [[ -z "$EXPECTED_HEAD" || "$actual" != "$EXPECTED_HEAD" ]]; then
            echo "::error::Branch do PR mudou durante a validacao. Nao publicar."
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --squash --delete-branch
          # A push from GITHUB_TOKEN does not start ordinary push workflows.
          # Explicit workflow_dispatch does, including in bot-created merges.
          gh workflow run release-saboriza.yml --ref main
